<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#12141a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Гамбит — шахматный помощник</title>
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="src/styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l2.4 5.2 5.6.6-4.2 3.8 1.2 5.6L12 14.4 7 17.2l1.2-5.6L4 7.8l5.6-.6z" fill="currentColor"/></svg>
      </div>
      <div>
        <div class="brand-name">Гамбит</div>
        <div class="brand-sub">помощник и тренер</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btnNew" title="Новая партия" aria-label="Новая партия">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5V2L7 6l5 4V7a5 5 0 110 10 5 5 0 01-5-5H5a7 7 0 107-7z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="Настройки" aria-label="Настройки">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm9 4l-2.1-.7-.6-1.4 1.1-1.9-1.4-1.4-1.9 1.1-1.4-.6L14 4h-4l-.7 2.1-1.4.6-1.9-1.1-1.4 1.4 1.1 1.9-.6 1.4L3 12l2.1.7.6 1.4-1.1 1.9 1.4 1.4 1.9-1.1 1.4.6L10 20h4l.7-2.1 1.4-.6 1.9 1.1 1.4-1.4-1.1-1.9.6-1.4z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <!-- Игра -->
    <section class="board-panel">
      <div class="players">
        <div class="player" id="playerTop">
          <div class="avatar black"></div>
          <div class="player-meta">
            <div class="player-name" id="topName">Соперник</div>
            <div class="player-rating" id="topRating">бот · средний</div>
          </div>
          <div class="captured" id="topCaptured"></div>
          <div class="clock" id="topClock">10:00</div>
        </div>
      </div>

      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board" role="grid" aria-label="Шахматная доска"></div>
        <div class="eval-bar" id="evalBar" title="Оценка позиции">
          <div class="eval-fill" id="evalFill"></div>
          <div class="eval-zero"></div>
        </div>
      </div>

      <div class="players">
        <div class="player" id="playerBottom">
          <div class="avatar white"></div>
          <div class="player-meta">
            <div class="player-name" id="bottomName">Вы</div>
            <div class="player-rating" id="bottomRating">играете белыми</div>
          </div>
          <div class="captured" id="bottomCaptured"></div>
          <div class="clock" id="bottomClock">10:00</div>
        </div>
      </div>

      <div class="hint-bar" id="hintBar">
        <button class="btn btn-primary" id="btnHint">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 21h6v-1H9v1zm3-19a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z" fill="currentColor"/></svg>
          Подсказка
        </button>
        <button class="btn" id="btnUndo">Отменить</button>
        <button class="btn ghost" id="btnFlip" title="Перевернуть доску">⇅</button>
      </div>
    </section>

    <!-- Панель помощника -->
    <section class="side-panel">
      <div class="card coach" id="coachCard">
        <div class="card-head">
          <div class="card-title">
            <span class="dot" id="coachDot"></span> Тренер
          </div>
          <div class="coach-eval" id="coachEval">0.0</div>
        </div>
        <div class="coach-body" id="coachBody">
          <p class="muted">Сделайте ход или нажмите «Подсказка» — разберу позицию и предложу план.</p>
        </div>
        <div class="coach-foot">
          <button class="link-btn" id="btnWhyBest">Почему этот ход?</button>
          <button class="link-btn" id="btnThreats">Угрозы соперника</button>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Оценка</div>
          <div class="seg" id="depthSeg">
            <button data-depth="4">Быстро</button>
            <button data-depth="6" class="active">Средне</button>
            <button data-depth="9">Глубоко</button>
          </div>
        </div>
        <div class="eval-graph-wrap">
          <canvas id="evalGraph" height="72"></canvas>
        </div>
        <div class="lines" id="lines"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Партия</div>
          <div class="card-actions">
            <button class="link-btn" id="btnCopyPgn">PGN</button>
            <button class="link-btn" id="btnLoadFen">FEN</button>
          </div>
        </div>
        <div class="moves" id="moves"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="play">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 4h8v8H4zM12 12h8v8h-8z" fill="currentColor"/></svg>
      Игра
    </button>
    <button class="tab" data-tab="analyze">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 20h3V10H3v10zm5 0h3V4H8v16zm5 0h3v-7h-3v7zm5 0h3V7h-3v13z" fill="currentColor"/></svg>
      Разбор
    </button>
    <button class="tab" data-tab="train">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3l9 5-9 5-9-5 9-5zm0 12l9-5v3l-9 5-9-5v-3l9 5z" fill="currentColor"/></svg>
      Задачи
    </button>
  </nav>
</div>

<!-- Настройки -->
<div class="sheet-backdrop" id="settingsBackdrop" hidden>
  <div class="sheet" role="dialog" aria-label="Настройки">
    <div class="sheet-handle"></div>
    <h3>Настройки</h3>
    <label class="row">
      <span>Соперник</span>
      <select id="optOpponent">
        <option value="human">Два игрока</option>
        <option value="easy">Бот · новичок</option>
        <option value="medium" selected>Бот · средний</option>
        <option value="hard">Бот · сильный</option>
      </select>
    </label>
    <label class="row">
      <span>Контроль времени</span>
      <select id="optTime">
        <option value="0">Без часов</option>
        <option value="180">3 минуты</option>
        <option value="300">5 минут</option>
        <option value="600" selected>10 минут</option>
      </select>
    </label>
    <label class="row">
      <span>Моя сторона</span>
      <select id="optSide">
        <option value="w" selected>Белые</option>
        <option value="b">Чёрные</option>
        <option value="random">Случайно</option>
      </select>
    </label>
    <label class="row">
      <span>Предупреждать о зевках</span>
      <select id="optWarn">
        <option value="on" selected>Да</option>
        <option value="off">Нет</option>
      </select>
    </label>
    <button class="btn btn-primary full" id="btnApplyNew">Начать новую партию</button>
  </div>
</div>

<!-- FEN / PGN -->
<div class="sheet-backdrop" id="textBackdrop" hidden>
  <div class="sheet" role="dialog" aria-label="Текст партии">
    <div class="sheet-handle"></div>
    <h3 id="textTitle">FEN</h3>
    <textarea id="textArea" spellcheck="false"></textarea>
    <div class="row-btns">
      <button class="btn" id="btnTextCancel">Закрыть</button>
      <button class="btn btn-primary" id="btnTextApply">Загрузить</button>
    </div>
  </div>
</div>

<!-- Разбор -->
<div class="sheet-backdrop" id="analyzeBackdrop" hidden>
  <div class="sheet tall" role="dialog" aria-label="Разбор партии">
    <div class="sheet-handle"></div>
    <h3>Разбор партии</h3>
    <div id="analyzeBody" class="analyze-body"></div>
    <div class="row-btns">
      <button class="btn" id="btnAnalyzeClose">Закрыть</button>
      <button class="btn btn-primary" id="btnAnalyzeRun">Разобрать</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="src/app.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
